<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco · la porta dalla tavola di fabbrica</title>
<style>
  html, body { height: auto; overflow: auto; }
  body { margin: 0; padding: 24px 30px 50px; background: #efeae0; color: #2b211a;
         font: 15px/1.5 Jost, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sotto { color: #7a6c5d; margin: 0 0 18px; max-width: 96ch; font-size: 13.5px; }
  .riq { background: #fffdf8; border: 1px solid #e2dacb; border-radius: 6px;
         padding: 10px; }
  .riq h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
            color: #9a8b78; margin: 0 0 8px; font-weight: 600; }
  .riq canvas { display: block; width: 100%; height: 760px; cursor: grab; }
  .riq canvas:active { cursor: grabbing; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .barra button { font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
                  background: #fffdf8; border: 1px solid #d8cebc; border-radius: 4px;
                  color: #6b5c4c; }
  .barra button.on { background: #a9472f; border-color: #a9472f; color: #fff; }
  .etich { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
           color: #9a8b78; align-self: center; margin-right: 4px; }
  .nota { margin-top: 18px; font-size: 12.5px; color: #8d7d6a; background: #fffdf8;
          border: 1px dashed #ccc2b1; border-radius: 6px; padding: 14px 16px;
          max-width: 100ch; }
  .nota b { color: #a9472f; }
  table.q { border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  table.q td { padding: 2px 14px 2px 0; color: #7a6c5d; }
  table.q td:last-child { color: #2b211a; font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>

<h1 id="titolo">Banco della porta</h1>
<p class="sotto" id="riassunto">…</p>

<div class="barra">
  <button data-vedi="telaio" class="on">Telaio</button>
  <button data-vedi="anta" class="on">Anta</button>
  <button data-vedi="pannelli" class="on">Pannelli</button>
  <button data-vedi="ferro" class="on">Ferramenta</button>
  <button id="esploso">Esploso</button>
  <button id="apri">Apri</button>
</div>

<div class="barra">
  <span class="etich">Mano</span>
  <button data-mano="1" class="on">Sinistra · cerniere a destra</button>
  <button data-mano="-1">Destra · cerniere a sinistra</button>
</div>

<div class="barra">
  <span class="etich">Modello</span>
  <button data-porta="siena" class="on">Siena</button>
  <button data-porta="piccadilly">Piccadilly</button>
  <button data-porta="cosenza">Cosenza</button>
  <button data-porta="roma">Roma</button>
</div>

<div class="barra">
  <span class="etich">Finitura del riquadro</span>
  <button data-tipo="1" class="on">Tipo 1 · bugnato</button>
  <button data-tipo="2">Tipo 2 · tondo, piatto</button>
  <button data-tipo="3">Tipo 3 · vivo, piatto</button>
</div>

<div class="barra">
  <span class="etich">Coprifilo</span>
  <span id="copriBottoni"></span>
</div>

<div class="riq"><h2>Il solido ricavato — trascina per girarlo</h2><canvas id="tela"></canvas></div>

<p class="nota" id="nota"></p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// la stessa tabella che usa il configuratore: quale DXF per quale
// coprifilo, e per quale misura di listino
import { PROFILI } from './js/visore-profilo.js';
import { caricaPorta, creaPorta } from './js/porta3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SAOPass } from 'three/addons/postprocessing/SAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   UN MOTORE SOLO: LA SEZIONE CHE CORRE LUNGO IL SUO ASSE

   La porta precedente (700-C) era arrivata come alzato e basta, e la
   profondita' li' non c'e': si era dovuto dare a ogni riquadro un
   gradino inventato, e si era scritto che era inventato.

   Questa tavola porta le due sezioni. Allora il pezzo non si inventa
   piu': OGNI pezzo di una porta e' la sua sezione tirata per la sua
   lunghezza -- il montante in verticale, il traverso in orizzontale, lo
   stipite intorno al vano. E' letteralmente come esce dalla toupie.
   Quindi qui non c'e' un modellatore: c'e' UNA funzione che estrude una
   sezione lungo un asse, chiamata sei volte.

   Il pannello e' l'unico che non e' un'estrusione: la bugna si gonfia
   verso il centro su tutti e quattro i lati insieme, e agli angoli i
   quattro versi si incontrano in mitra. Si costruisce facendo rientrare
   il rettangolo del riquadro un po' per volta seguendo il profilo della
   sezione: la mitra viene da sola, perche' rientrando un rettangolo gli
   angoli si tagliano a 45 senza che nessuno glielo dica.
   ============================================================ */

/* TRE CATALOGHI, NON UNO. Il disegno della porta e' suo; il telaio e i
   coprifili sono di tutti.
   Un coprifilo non appartiene all'anta -- sta sul muro, e l'anta non lo
   tocca nemmeno. Il telaio nemmeno: la fabbrica non ne vende
   quarantaquattro, ne vende due o tre. Percio' stanno in cataloghi
   separati e il modello dice solo QUALE monta.
   Aggiungere una porta nuova vuol dire un file da cinquanta chilobyte:
   coprifili, telaio, mani, finiture e animazione se li trova gia'
   fatti. */
/* Il modello si sceglie. E' l'unica cosa che cambia da una porta
   all'altra: la Piccadilly eredita dalla Siena montante, traverso,
   bugna e telaio, perche' il suo disegno storico e' un alzato solo --
   SEZ-A e SEZ-B non ce le ha. */
const modello = new URLSearchParams(location.search).get('porta') || 'siena';
const d = await caricaPorta(modello);
const L = d.anta.larghezza, H = d.anta.altezza, T = d.spessore;

/* ── la scena ───────────────────────────────────────────────────────── */
const tela = document.getElementById('tela');
const rend = new THREE.WebGLRenderer({ canvas: tela, antialias: true, alpha: true });
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.toneMapping = THREE.NeutralToneMapping;
rend.toneMappingExposure = 0.82;

const scena = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(rend);
scena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const tx = new THREE.TextureLoader();
function legno() {
  const carica = (n, srgb) => {
    const t = tx.load(`assets/textures/rovere/${n}`);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  };
  return new THREE.MeshStandardMaterial({
    map: carica('albedo.jpg', true),
    normalMap: carica('normal.jpg'),
    roughnessMap: carica('roughness.jpg'),
    // la venatura non deve competere col rilievo: il configuratore tiene
    // la normale a 0,8 per lo stesso motivo
    normalScale: new THREE.Vector2(.8, .8),
    roughness: .62, metalness: 0, envMapIntensity: .5,
  });
}
const mat = legno();

let suolo = null;          // il pavimento, montato piu' sotto
let compositore = null;    // e la catena di resa, con l'occlusione

/* Il motore sta in js/porta3d.js: lo stesso che usera' il
   configuratore. Qui il banco ci mette intorno la stanza -- luci,
   ombre, occlusione, pavimento, muro -- e i comandi per guardarlo. */
const porta = creaPorta(d, PROFILI, mat);
scena.add(porta.gruppo);
const { gTelaio, anta: gAnta, pannelli: gPann, ferro: gFerro } = porta.parti;
await porta.pronta;

/* Il muro lo monta il modulo: e' fatto delle stesse quote del telaio,
   e nel configuratore non servira' -- li' la stanza c'e' gia'. */
const gMuro = porta.muro();
if (gMuro) scena.add(gMuro);

/* ── inquadratura ───────────────────────────────────────────────────── */
const centro = new THREE.Vector3(L / 2, H / 2, T / 2);
const cam = new THREE.PerspectiveCamera(26, 1, 120, 14000);
const controlli = new OrbitControls(cam, tela);
controlli.enableDamping = true;
controlli.dampingFactor = .08;
/* Non si entra dentro il piano vicino della camera. Quel piano e' stato
   avvicinato a 120 mm apposta -- da 5 a 20000 il buffer di profondita'
   non ha risoluzione e l'occlusione usciva a chiazze bianche -- ma cosi'
   avvicinandosi troppo il legno verrebbe tagliato via. */
controlli.minDistance = 260;
controlli.target.copy(centro);

function misura() {
  const w = tela.clientWidth, h = tela.clientHeight;
  rend.setSize(w, h, false);
  if (compositore) compositore.setSize(w, h);
  cam.aspect = w / h;
  const mezzoV = cam.fov * Math.PI / 360;
  const mezzoO = Math.atan(Math.tan(mezzoV) * cam.aspect);
  const via = 0.5 * Math.hypot(porta.misure.largoTot, H)
            / Math.sin(Math.min(mezzoV, mezzoO)) * 1.02;
  if (!cam.userData.messa) {
    cam.position.set(centro.x + via * .40, centro.y + via * .16, centro.z + via * .90);
    cam.userData.messa = true;
  }
  cam.updateProjectionMatrix();
}
misura();
addEventListener('resize', misura);

/* ── la luce, che qui e' meta' del rilievo ──────────────────────────── */
/* La porta sembrava piatta, e non era la geometria: era da dove veniva
   la luce. Misurato sui due impianti -- questo banco e il configuratore
   grande, che invece il rilievo lo mostra:
     configuratore   luce a 72 gradi dalla normale della porta: RADENTE
     banco (prima)   luce a 40 gradi: quasi in faccia
   A quaranta gradi una modanatura inclinata di dieci cambia il chiaro di
   due punti e non si vede; a settantadue ne cambia un terzo. E' tutta li'
   la differenza.
   Piu' le OMBRE, che qui non c'erano affatto: una bugna si legge
   soprattutto dall'ombra che la sua modanatura getta sul campo, e senza
   ombre quell'ombra non c'e'. */
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFSoftShadowMap;

const chiave = new THREE.DirectionalLight(0xffffff, 2.1);
chiave.position.set(-2600, 2900, 1300);      // 72 gradi, come il configuratore
chiave.castShadow = true;
chiave.shadow.mapSize.set(4096, 4096);
chiave.shadow.bias = -0.0004;
chiave.shadow.normalBias = 1.2;              // in mm: qui si lavora in mm
chiave.shadow.radius = 3;
const campo = 1700;                          // mezza scena, in mm
chiave.shadow.camera.left = chiave.shadow.camera.bottom = -campo;
chiave.shadow.camera.right = chiave.shadow.camera.top = campo;
chiave.shadow.camera.near = 500;
chiave.shadow.camera.far = 9000;
chiave.target.position.set(L / 2, H / 2, 0);
scena.add(chiave, chiave.target);

// il riempimento resta basso apposta: se lo si alza, riempie le ombre e
// il rilievo torna piatto -- e' l'errore che si fa per «vedere meglio»
const riempi = new THREE.DirectionalLight(0xffffff, .28);
riempi.position.set(2200, 900, 1800);
scena.add(riempi);

/* Tutto fa ombra e la riceve, muro compreso. Va richiamata dopo ogni
   rimontaggio: l'anta e i coprifili si rifanno quando si cambia tipo o
   modello, e i pezzi nuovi nascono senza. */
function ombre() {
  scena.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  if (suolo) suolo.castShadow = false;   // il pavimento la riceve e basta
}

/* Un pavimento. Non e' scenografia: senza, la porta galleggia, e manca
   l'ombra a terra -- che e' quella che dice a occhio quanto lo stipite
   sporge dal muro. Costa un piano e una riga. */
suolo = new THREE.Mesh(
  new THREE.PlaneGeometry(9000, 9000),
  new THREE.MeshStandardMaterial({ color: 0xcfc6b8, roughness: .9 }));
suolo.rotation.x = -Math.PI / 2;
suolo.position.set(L / 2, 0, 0);
scena.add(suolo);

ombre();

/* ── l'occlusione: il buio dove due superfici si incontrano ─────────── */
/* L'ultima cosa che mancava, e l'unica che non tocca un millimetro della
   porta. Le ombre che getta la luce fanno il grosso, ma restano chiare
   proprio dove un occhio si aspetta il buio: in fondo alla cava del
   pannello, nell'angolo fra bugna e riquadro, dietro al coprifilo. Li'
   non e' che manchi la luce diretta -- manca il CIELO, perche' le due
   facce si fanno ombra a vicenda.
   Misurato: la luce radente aveva gia' portato il salto sulla modanatura
   da 44 a 53. Alzare ancora l'angolo o abbassare il riempimento dava
   un altro 4 e 1,5 per cento -- briciole. L'occlusione lavora invece
   dove nessuna delle due arriva. */
/* IL DESTINO DEL COMPOSITORE VUOLE IL MULTICAMPIONAMENTO, e senza era
   il difetto peggiore di tutti.
   `WebGLRenderer({antialias: true})` lisca i bordi solo quando disegna
   DRITTO SULLO SCHERMO. Appena si passa da un EffectComposer la scena
   finisce prima in un buffer intermedio, e quel buffer nasce senza
   campioni: ogni sagoma esce col bordo a scaletta dura, e siccome il
   disegno degli scalini si rifa' a ogni fotogramma, girando la scena
   luccica. Era il tratteggio che si vedeva lungo tutti i contorni --
   anche contro il muro e contro il fondo, non solo fra i pezzi.
   E' anche il motivo per cui sette prove di fila erano tornate negative:
   tutte e sette lasciavano il compositore nella catena. Spegnere
   l'occlusione spegne il PASSO, non il compositore -- la scena cadeva
   lo stesso nello stesso buffer liscio come una scala. */
const destino = new THREE.WebGLRenderTarget(1, 1, {
  samples: 4, type: THREE.HalfFloatType,
});
compositore = new EffectComposer(rend, destino);
compositore.addPass(new RenderPass(scena, cam));
const sao = new SAOPass(scena, cam);
sao.params.saoBias = 2.5;
sao.params.saoIntensity = 0.012;
sao.params.saoScale = 60;        // in mm: il raggio entro cui cerca il buio
sao.params.saoKernelRadius = 28;
sao.params.saoBlur = true;
sao.params.saoBlurRadius = 6;
compositore.addPass(sao);
compositore.addPass(new OutputPass());
// la misura era gia' stata presa quando il compositore non c'era
// ancora: si ridomanda, se no il suo destino resta grande un pixel
misura();

/* ── apre e chiude ──────────────────────────────────────────────────── */
/* L'ordine conta, ed e' quello che si fa con la mano: prima si abbassa
   la maniglia, lo scrocco rientra, POI la porta parte. Se parte insieme
   sembra che si apra da sola e la maniglia sia un ornamento.
   In chiusura la maniglia non si tocca: lo scrocco ha lo smusso e scavalca
   l'incontro da solo. E' per questo che una porta si chiude con una
   spinta e si apre no. */
const DURATA = 2.1;                     // secondi di corsa dell'anta
let meta = 0, adesso = 0;               // dove deve stare, e dove sta

let prima = performance.now();
(function anima(ora) {
  const dt = Math.min(.05, ((ora || prima) - prima) / 1000);
  prima = ora || prima;
  const passo = dt / DURATA;
  adesso += Math.max(-passo, Math.min(passo, meta - adesso));

  porta.apertura(adesso);

  controlli.update();
  compositore.render();
  requestAnimationFrame(anima);
}());

// il banco si guarda anche da fuori, per fare le prove
window.__banco = { cam, controlli, scena, centro, dati: d, sao, rend,
                   get compositore() { return compositore; },
                   get angolo() { return porta.perno.rotation.y; },
                   porta,
                 };

/* ── comandi ────────────────────────────────────────────────────────── */
const gruppi = { telaio: gTelaio, anta: gAnta, pannelli: gPann, ferro: gFerro };
document.querySelectorAll('[data-vedi]').forEach((b) => b.addEventListener('click', () => {
  b.classList.toggle('on');
  gruppi[b.dataset.vedi].visible = b.classList.contains('on');
}));
let esploso = false;
document.getElementById('esploso').addEventListener('click', (ev) => {
  esploso = !esploso;
  ev.target.classList.toggle('on', esploso);
  gTelaio.position.z = esploso ? -260 : 0;
  gPann.position.z = esploso ? 260 : 0;
});

let tipo = 1;
document.getElementById('copriBottoni').innerHTML = Object.keys(PROFILI)
  .map((k, i) => `<button data-copri="${k}"${i === 0 ? ' class="on"' : ''}>${
    k[0].toUpperCase() + k.slice(1)}</button>`).join(' ');
document.querySelectorAll('[data-copri]').forEach((b) => b.addEventListener('click', async () => {
  document.querySelectorAll('[data-copri]').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  await porta.coprifilo(b.dataset.copri);
}));

document.querySelectorAll('[data-porta]').forEach((b) => b.addEventListener('click', () => {
  location.search = `?porta=${b.dataset.porta}`;
}));
document.querySelectorAll('[data-porta]').forEach((b) =>
  b.classList.toggle('on', b.dataset.porta === modello));

document.querySelectorAll('[data-tipo]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-tipo]').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  tipo = +b.dataset.tipo;
  porta.finitura(tipo);
  scriviNota();
}));

document.querySelectorAll('[data-mano]').forEach((b) => b.addEventListener('click', () => {
  if (+b.dataset.mano === porta.mano) return;
  document.querySelectorAll('[data-mano]').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  const m = +b.dataset.mano;
  // si richiude prima di cambiare mano: cambiarla ad anta aperta la
  // farebbe saltare da una parte all'altra del vano
  meta = 0; adesso = 0;
  bApri.classList.remove('on');
  bApri.textContent = 'Apri';
  porta.verso(m);
}));

const bApri = document.getElementById('apri');
bApri.addEventListener('click', () => {
  meta = meta > .5 ? 0 : 1;
  bApri.classList.toggle('on', meta > .5);
  bApri.textContent = meta > .5 ? 'Chiudi' : 'Apri';
});

/* ── quello che il file ha detto ────────────────────────────────────── */
const q = d.quote;
/* Il titolo lo dice la porta, non l'HTML: era scritto «BASE HT789» a
   mano e restava li' anche guardando Roma. */
/* `origine` no: ce l'ha gia' il telaio, e caricaPorta fonde i due
   dizionari -- il campo del telaio finiva nel titolo di ogni porta. */
document.getElementById('titolo').textContent = d.tracciato
  ? `${d.nome} — ${d.tracciato}` : `${d.nome} — dalla tavola di fabbrica`;
/* Una porta puo' non avere quote: quelle vengono dai testi del DXF, e
   una porta ricalcata a mano non ne ha nessuna. Senza questo `|| {}` il
   banco moriva prima di disegnare -- schermo nero e basta. */
const uno = (k) => ((q || {})[k] || []).join(' / ') || '—';
document.getElementById('riassunto').textContent =
  `Anta ${L} × ${H} × ${T} mm — due montanti larghi ${d.montante.larghezza}, `
  + `${d.traversi.length} traversi (${d.traversi.map((t) => Math.round(t.y1 - t.y0)).join(', ')}), `
  + `${d.riquadri.length} pannelli bugnati spessi ${d.pannello.spessore} che in cava scendono a `
  + `${(d.pannello.bugna[0][1] * 2).toFixed(1)}. `
  + `Luce netta ${uno('LUCENETTA')}, esterno telaio ${uno('ESTERNOTELAIO')} × ${uno('EST.TELAIO')}, HT ${uno('HT')}.`;

function scriviNota() {
  const daNoi = tipo === 1
    ? 'la traversa alta del telaio e\' presa dalla SEZ-A e gli stipiti dalla '
      + 'SEZ-B, e dove si incontrano la tavola non dice se il giunto e\' in '
      + 'mitra o a sormonto — qui e\' a sormonto.'
    : `il <b>tipo ${tipo}</b> e' l'unico pezzo qui dentro DISEGNATO DA NOI: `
      + 'quel DXF non e\' ancora arrivato, e il labbro '
      + (tipo === 2 ? 'tondo' : 'a spigolo vivo')
      + ' e\' ricavato dal catalogo. Restano vere le misure che contano — '
      + `la cava larga ${porta.cava.larga} a ${porta.cava.z} mm dalla faccia, e il rientro di `
      + `${porta.cava.rientro}: si cambia la forma del labbro, non dove sta. Quando la `
      + 'fabbrica manda la sezione, si sostituisce e basta.';
  document.getElementById('nota').innerHTML =
    '<b>Che differenza fa avere le sezioni.</b> Del 700-C avevamo solo l\'alzato, '
    + 'e di fronte la profondita\' non si vede: ogni gradino era una nostra stima. '
    + 'Qui invece ogni pezzo e\' la sua sezione vera tirata per la sua lunghezza — '
    + 'il montante in verticale, i traversi in orizzontale, il telaio intorno al vano — '
    + 'e la bugna del pannello e\' la curva letta punto per punto sulla SEZ-B, '
    + `${d.pannello.bugna.length} campioni dal filo della cava fino al colmo. `
    + 'Non c\'e\' quasi niente di inventato: ' + daNoi;
}
scriviNota();
</script>
</body>
</html>
