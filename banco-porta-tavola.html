<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco · la porta dalla tavola di fabbrica</title>
<style>
  html, body { height: auto; overflow: auto; }
  body { margin: 0; padding: 24px 30px 50px; background: #efeae0; color: #2b211a;
         font: 15px/1.5 Jost, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sotto { color: #7a6c5d; margin: 0 0 18px; max-width: 96ch; font-size: 13.5px; }
  .riq { background: #fffdf8; border: 1px solid #e2dacb; border-radius: 6px;
         padding: 10px; }
  .riq h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
            color: #9a8b78; margin: 0 0 8px; font-weight: 600; }
  .riq canvas { display: block; width: 100%; height: 760px; cursor: grab; }
  .riq canvas:active { cursor: grabbing; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .barra button { font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
                  background: #fffdf8; border: 1px solid #d8cebc; border-radius: 4px;
                  color: #6b5c4c; }
  .barra button.on { background: #a9472f; border-color: #a9472f; color: #fff; }
  .nota { margin-top: 18px; font-size: 12.5px; color: #8d7d6a; background: #fffdf8;
          border: 1px dashed #ccc2b1; border-radius: 6px; padding: 14px 16px;
          max-width: 100ch; }
  .nota b { color: #a9472f; }
  table.q { border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  table.q td { padding: 2px 14px 2px 0; color: #7a6c5d; }
  table.q td:last-child { color: #2b211a; font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>

<h1>BASE HT789 — dalla tavola di fabbrica</h1>
<p class="sotto" id="riassunto">…</p>

<div class="barra">
  <button data-vedi="telaio" class="on">Telaio</button>
  <button data-vedi="anta" class="on">Anta</button>
  <button data-vedi="pannelli" class="on">Pannelli</button>
  <button id="esploso">Esploso</button>
</div>

<div class="riq"><h2>Il solido ricavato — trascina per girarlo</h2><canvas id="tela"></canvas></div>

<p class="nota" id="nota"></p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   UN MOTORE SOLO: LA SEZIONE CHE CORRE LUNGO IL SUO ASSE

   La porta precedente (700-C) era arrivata come alzato e basta, e la
   profondita' li' non c'e': si era dovuto dare a ogni riquadro un
   gradino inventato, e si era scritto che era inventato.

   Questa tavola porta le due sezioni. Allora il pezzo non si inventa
   piu': OGNI pezzo di una porta e' la sua sezione tirata per la sua
   lunghezza -- il montante in verticale, il traverso in orizzontale, lo
   stipite intorno al vano. E' letteralmente come esce dalla toupie.
   Quindi qui non c'e' un modellatore: c'e' UNA funzione che estrude una
   sezione lungo un asse, chiamata sei volte.

   Il pannello e' l'unico che non e' un'estrusione: la bugna si gonfia
   verso il centro su tutti e quattro i lati insieme, e agli angoli i
   quattro versi si incontrano in mitra. Si costruisce facendo rientrare
   il rettangolo del riquadro un po' per volta seguendo il profilo della
   sezione: la mitra viene da sola, perche' rientrando un rettangolo gli
   angoli si tagliano a 45 senza che nessuno glielo dica.
   ============================================================ */

const d = await (await fetch('assets/profili/base-ht789-tavola.json')).json();
const L = d.anta.larghezza, H = d.anta.altezza, T = d.spessore;

/* ── le due estrusioni ──────────────────────────────────────────────── */

/* La sezione arriva come coppie (a, b) nel piano del taglio; l'asse su
   cui corre e' il terzo. ExtrudeGeometry pero' sa fare solo forme nel
   piano XY tirate lungo Z, quindi la forma si costruisce girata e poi
   si ruota tutta. Le rotazioni sono vere rotazioni e non specchi: uno
   specchio inverte il verso dei triangoli e la luce entrerebbe dalla
   parte sbagliata. */
function sagoma(punti) {
  const s = new THREE.Shape();
  punti.forEach(([a, b], i) => (i ? s.lineTo(a, b) : s.moveTo(a, b)));
  s.closePath();
  return s;
}

/** Sezione in (X, Z), tirata lungo Y da y0 a y1. Montanti e stipiti. */
function verticale(punti, y0, y1) {
  const g = new THREE.ExtrudeGeometry(
    sagoma(punti.map(([x, z]) => [x, -z])),
    { depth: y1 - y0, bevelEnabled: false, curveSegments: 1 });
  g.rotateX(-Math.PI / 2);            // (x, y, t) → (x, t, -y)
  g.translate(0, y0, 0);
  return g;
}

/** Sezione in (Y, Z), tirata lungo X da x0 a x1. Traversi e traversa alta. */
function orizzontale(punti, x0, x1) {
  const g = new THREE.ExtrudeGeometry(
    sagoma(punti.map(([y, z]) => [-z, y])),
    { depth: x1 - x0, bevelEnabled: false, curveSegments: 1 });
  g.rotateY(Math.PI / 2);             // (x, y, t) → (t, y, -x)
  g.translate(x0, 0, 0);
  return g;
}

/* Specchiare un pezzo senza specchiare la geometria: si ribalta la
   SEZIONE (e si gira anche l'ordine dei punti, se no il contorno
   cambia verso e le pareti guardano dentro). */
const ribalta = (punti, attorno) =>
  punti.map(([a, b]) => [attorno - a, b]).reverse();

/* ── il pannello con la bugna ───────────────────────────────────────── */
/* Ogni campione della bugna e' un anello: il rettangolo del riquadro
   rientrato di d, alla quota z. Fra un anello e il successivo, quattro
   quadrilateri -- uno per lato. I quattro lati restano SEPARATI apposta:
   lungo il rientro la superficie deve essere liscia, ma sull'angolo no,
   li' ci va lo spigolo netto della mitra. Un solo pezzo cucito darebbe
   una bugna che agli angoli si arrotonda, che nel legno non succede. */
function pannello(r, bugna, zc, gioco) {
  const x0 = r.x0 + gioco, x1 = r.x1 - gioco;
  const y0 = r.y0 + gioco, y1 = r.y1 - gioco;
  const pos = [], idx = [], uv = [];
  let n = 0;

  // i quattro lati, come coppie di angoli in funzione del rientro
  const LATI = [
    (t) => [[x0 + t, y0 + t], [x1 - t, y0 + t]],   // sotto
    (t) => [[x1 - t, y0 + t], [x1 - t, y1 - t]],   // destra
    (t) => [[x1 - t, y1 - t], [x0 + t, y1 - t]],   // sopra
    (t) => [[x0 + t, y1 - t], [x0 + t, y0 + t]],   // sinistra
  ];
  const metti = (p, z) => { pos.push(p[0], p[1], z); uv.push(p[0] / 1000, p[1] / 1000); return n++; };

  for (const verso of [1, -1]) {
    for (const lato of LATI) {
      const base = n;
      for (const [dist, z] of bugna) {
        const [a, b] = lato(dist);
        metti(a, zc + verso * z);
        metti(b, zc + verso * z);
      }
      for (let i = 0; i + 1 < bugna.length; i++) {
        const p = base + i * 2;
        if (verso > 0) idx.push(p, p + 1, p + 3, p, p + 3, p + 2);
        else idx.push(p, p + 3, p + 1, p, p + 2, p + 3);
      }
    }
    // il piano in mezzo, dove la bugna ha finito di salire
    const t = bugna[bugna.length - 1][0], z = zc + verso * bugna[bugna.length - 1][1];
    const c = [metti([x0 + t, y0 + t], z), metti([x1 - t, y0 + t], z),
               metti([x1 - t, y1 - t], z), metti([x0 + t, y1 - t], z)];
    if (verso > 0) idx.push(c[0], c[1], c[2], c[0], c[2], c[3]);
    else idx.push(c[0], c[2], c[1], c[0], c[3], c[2]);
  }
  // il fianco che sta dentro la cava
  const zt = bugna[0][1];
  for (const lato of LATI) {
    const [a, b] = lato(0);
    const p = [metti(a, zc + zt), metti(b, zc + zt), metti(a, zc - zt), metti(b, zc - zt)];
    idx.push(p[0], p[2], p[1], p[1], p[2], p[3]);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ── la scena ───────────────────────────────────────────────────────── */
const tela = document.getElementById('tela');
const rend = new THREE.WebGLRenderer({ canvas: tela, antialias: true, alpha: true });
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.toneMapping = THREE.NeutralToneMapping;
rend.toneMappingExposure = 0.82;

const scena = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(rend);
scena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const tx = new THREE.TextureLoader();
function legno() {
  const carica = (n, srgb) => {
    const t = tx.load(`assets/textures/rovere/${n}`);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  };
  return new THREE.MeshStandardMaterial({
    map: carica('albedo.jpg', true),
    normalMap: carica('normal.jpg'),
    roughnessMap: carica('roughness.jpg'),
    roughness: .62, metalness: 0, envMapIntensity: .5,
  });
}
const mat = legno();

/* LE UV VANNO RIFATTE, non bastano quelle che escono dall'estrusione.
   ExtrudeGeometry le prende dalle coordinate della SEZIONE -- che qui
   e' larga 114 mm e lunga duemila -- e la texture veniva stirata in una
   striscia sola: i montanti e i traversi uscivano di legno finto liscio,
   e si vedeva la differenza coi pannelli, che le UV ce l'hanno a posto.

   Si proietta di piatto sul davanti, che di una porta e' la faccia che
   si guarda. E si gira di un quarto sui pezzi orizzontali: la grana di
   un traverso corre per il lungo del traverso, come il tavolame da cui
   e' stato tagliato. E' la cosa che, guardando una porta vera, dice
   subito che i pezzi sono pezzi e non un disegno stampato sopra. */
const PASSO = 760;                  // quanto misura, in mm, una piastrella
function grana(geo, giro) {
  const p = geo.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) / PASSO, y = p.getY(i) / PASSO;
    uv[i * 2] = giro ? y : x;
    uv[i * 2 + 1] = giro ? x : y;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return geo;
}

const gTelaio = new THREE.Group(), gAnta = new THREE.Group(),
      gPann = new THREE.Group();
scena.add(gTelaio, gAnta, gPann);

const metti = (gruppo, geo, giro) => {
  gruppo.add(new THREE.Mesh(grana(geo, giro), mat));
  return geo;
};

/* i montanti: tutta l'altezza dell'anta, come in bottega */
metti(gAnta, verticale(d.montante.punti, 0, H), false);
metti(gAnta, verticale(ribalta(d.montante.punti, L), 0, H), false);

/* i traversi: da fondo cava a fondo cava, cosi' il loro tenone riempie
   la cava del montante e sull'angolo non resta uno spiraglio */
const cavaSx = d.riquadri[0].x0, cavaDx = d.riquadri[0].x1;
for (const t of d.traversi) metti(gAnta, orizzontale(t.punti, cavaSx, cavaDx), true);

/* i pannelli */
for (const r of d.riquadri) {
  metti(gPann, pannello(r, d.pannello.bugna, d.pannello.z_centro,
                        d.pannello.gioco), false);
}

/* Il telaio: la tavola ne da' due stipiti gia' al loro posto -- uno per
   parte, non serve specchiarne uno -- e la traversa alta. Lo stipite
   arriva sotto la traversa e la traversa passa da parte a parte: e' il
   giunto che si vede guardando in alto in un vano di porta. */
const bordi = (curve, i) => curve.flatMap((c) => c.map((p) => p[i]));
const telaioAltoY = Math.min(...bordi(d.telaio_alto, 0));
const spor = -Math.min(...bordi(d.telaio, 0));      // quanto sporge dal filo anta
for (const c of d.telaio) metti(gTelaio, verticale(c, 0, telaioAltoY), false);
for (const c of d.telaio_alto) {
  metti(gTelaio, orizzontale(c, -spor, L + spor), true);
}

/* Il muro. Senza, fra anta e telaio si vede il fondo della pagina
   attraverso la fessura, e una porta che lascia passare la luce tutto
   intorno non e' una porta. Spessore e filo del vano vengono dal
   tratteggio della SEZ-B, l'altezza del vano dalla traversa. */
if (d.muro) {
  const m = d.muro, matMuro = new THREE.MeshStandardMaterial({
    color: 0xe6ded1, roughness: .95, metalness: 0,
  });
  const alto = telaioAltoY + 40;
  const mattone = (x0, x1, y0, y1) => {
    const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, m.z1 - m.z0);
    g.translate((x0 + x1) / 2, (y0 + y1) / 2, (m.z0 + m.z1) / 2);
    gTelaio.add(new THREE.Mesh(g, matMuro));
  };
  mattone(m.x0 - 900, m.x0, 0, alto + 700);
  mattone(m.x1, m.x1 + 900, 0, alto + 700);
  mattone(m.x0, m.x1, alto, alto + 700);
}

/* ── inquadratura ───────────────────────────────────────────────────── */
const centro = new THREE.Vector3(L / 2, H / 2, T / 2);
const cam = new THREE.PerspectiveCamera(26, 1, 5, 20000);
const controlli = new OrbitControls(cam, tela);
controlli.enableDamping = true;
controlli.dampingFactor = .08;
controlli.target.copy(centro);

function misura() {
  const w = tela.clientWidth, h = tela.clientHeight;
  rend.setSize(w, h, false);
  cam.aspect = w / h;
  const mezzoV = cam.fov * Math.PI / 360;
  const mezzoO = Math.atan(Math.tan(mezzoV) * cam.aspect);
  const via = 0.5 * Math.hypot(L + 2 * spor, H) / Math.sin(Math.min(mezzoV, mezzoO)) * 1.02;
  if (!cam.userData.messa) {
    cam.position.set(centro.x + via * .40, centro.y + via * .16, centro.z + via * .90);
    cam.userData.messa = true;
  }
  cam.updateProjectionMatrix();
}
misura();
addEventListener('resize', misura);

const chiave = new THREE.DirectionalLight(0xffffff, 2.1);
chiave.position.set(-900, 1800, 2400);
scena.add(chiave);
const riempi = new THREE.DirectionalLight(0xffffff, .35);
riempi.position.set(1400, 700, 1200);
scena.add(riempi);

(function anima() {
  controlli.update();
  rend.render(scena, cam);
  requestAnimationFrame(anima);
}());

// il banco si guarda anche da fuori, per fare le prove
window.__banco = { cam, controlli, scena, centro, dati: d };

/* ── comandi ────────────────────────────────────────────────────────── */
const gruppi = { telaio: gTelaio, anta: gAnta, pannelli: gPann };
document.querySelectorAll('[data-vedi]').forEach((b) => b.addEventListener('click', () => {
  b.classList.toggle('on');
  gruppi[b.dataset.vedi].visible = b.classList.contains('on');
}));
let aperto = false;
document.getElementById('esploso').addEventListener('click', (ev) => {
  aperto = !aperto;
  ev.target.classList.toggle('on', aperto);
  gTelaio.position.z = aperto ? -260 : 0;
  gPann.position.z = aperto ? 260 : 0;
});

/* ── quello che il file ha detto ────────────────────────────────────── */
const q = d.quote;
const uno = (k) => (q[k] || []).join(' / ');
document.getElementById('riassunto').textContent =
  `Anta ${L} × ${H} × ${T} mm — due montanti larghi ${d.montante.larghezza}, `
  + `tre traversi (${d.traversi.map((t) => Math.round(t.y1 - t.y0)).join(', ')}), `
  + `due pannelli bugnati spessi ${d.pannello.spessore} che in cava scendono a `
  + `${(d.pannello.bugna[0][1] * 2).toFixed(1)}. `
  + `Luce netta ${uno('LUCENETTA')}, esterno telaio ${uno('ESTERNOTELAIO')} × ${uno('EST.TELAIO')}, HT ${uno('HT')}.`;

document.getElementById('nota').innerHTML =
  '<b>Che differenza fa avere le sezioni.</b> Del 700-C avevamo solo l\'alzato, '
  + 'e di fronte la profondita\' non si vede: ogni gradino era una nostra stima. '
  + 'Qui invece ogni pezzo e\' la sua sezione vera tirata per la sua lunghezza — '
  + 'il montante in verticale, i traversi in orizzontale, il telaio intorno al vano — '
  + 'e la bugna del pannello e\' la curva letta punto per punto sulla SEZ-B, '
  + `${d.pannello.bugna.length} campioni dal filo della cava fino al colmo. `
  + 'Non c\'e\' piu\' niente di inventato, salvo una cosa: la traversa alta del telaio '
  + 'e\' presa dalla SEZ-A e gli stipiti dalla SEZ-B, e dove si incontrano '
  + 'la tavola non dice se il giunto e\' in mitra o a sormonto — qui e\' a sormonto.';
</script>
</body>
</html>
