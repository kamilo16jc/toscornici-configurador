<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porte 3D · dal disegno al solido</title>
<style>
  :root { --carta: #f2efe9; --inchiostro: #2b241d; --tenue: #9a8f80;
          --filo: #ddd6c9; --acceso: #a9472f; }
  * { box-sizing: border-box; }
  /* display:grid batte l'attributo hidden: senza questa riga il
     cartello «trascina un DXF» resta stampato sopra al disegno */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr;
         background: var(--carta); color: var(--inchiostro);
         font: 13px/1.5 Jost, "Segoe UI", system-ui, sans-serif; }

  header { display: flex; align-items: center; gap: 18px;
           padding: 10px 18px; border-bottom: 1px solid var(--filo); }
  header b { font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
             font-size: 11px; color: var(--tenue); }
  header .nome { font-size: 14px; }
  header .dx { margin-left: auto; display: flex; gap: 8px; }

  button { font: inherit; font-size: 12px; padding: 4px 11px; cursor: pointer;
           background: transparent; border: 1px solid var(--filo);
           border-radius: 3px; color: var(--inchiostro); }
  button:hover { border-color: var(--acceso); }
  button.on { background: var(--acceso); border-color: var(--acceso); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }

  main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .telo { position: relative; min-height: 0; }
  .telo + .telo { border-left: 1px solid var(--filo); }
  canvas { display: block; width: 100%; height: 100%; }
  #piano { cursor: crosshair; }

  .ruoli { position: absolute; left: 12px; top: 12px; display: flex;
           flex-direction: column; gap: 4px; }
  .ruoli button { text-align: left; min-width: 132px; }
  .ruoli .conta { color: var(--tenue); float: right; }

  .vuoto { position: absolute; inset: 0; display: grid; place-content: center;
           text-align: center; color: var(--tenue); pointer-events: none; }
  .vuoto b { display: block; font-size: 15px; color: var(--inchiostro);
             margin-bottom: 6px; font-weight: 500; }
  body.sopra .vuoto b { color: var(--acceso); }
  .aiuto { position: absolute; left: 12px; bottom: 12px; color: var(--tenue);
           font-size: 11.5px; max-width: 46ch; }
</style>
</head>
<body>

<header>
  <b>Porte 3D</b>
  <span class="nome" id="nome">— trascina qui un DXF</span>
  <span class="dx">
    <button id="salva" disabled>Salva il modello</button>
  </span>
</header>

<main>
  <div class="telo">
    <canvas id="piano"></canvas>
    <div class="ruoli" id="ruoli"></div>
    <div class="vuoto" id="vuoto"><b>Trascina un DXF</b>
      dxf/tavole-complete — o qualunque tavola di fabbrica</div>
    <div class="aiuto" id="aiuto"></div>
  </div>
  <div class="telo"><canvas id="solido"></canvas></div>
</main>

<script>
/* IL LETTORE E' QUI DENTRO, NON IMPORTATO.

   Aperta con due clic la pagina sta su file://, e li' il browser RIFIUTA
   di caricare un modulo da un altro file: CORS, origine «null». Il
   risultato non e' un errore visibile -- semplicemente non gira niente, e
   il DXF che trascini se lo prende Chrome e te lo stampa come testo.
   Per questo il lettore e' copiato qui: la pagina dev'essere un file solo.
   La copia viene da js/dxf.js -- si rifa' con tools/impagina.py. */
/* ============================================================
   LEGGERE UN DXF NEL BROWSER

   Tutto quello che sa leggere i disegni della fabbrica finora stava in
   Python, e una pagina che si apre con due clic non lo puo' chiamare.
   Qui c'e' lo stesso mestiere, portato in JavaScript: le stesse regole,
   trovate una per una sbattendoci contro, e ognuna col perche'.

   NON E' UN LETTORE DXF GENERALE. Legge LINE, ARC e TEXT, che e' tutto
   quello che l'ufficio tecnico di Toscocornici usa: trecentosessantadue
   disegni e nient'altro dentro.
   ============================================================ */

const PASSO_ARCO = 2.0;   // gradi per segmento: sotto il decimo di mm
const SNAP = 0.01;        // due punti piu' vicini di cosi' sono lo stesso
const CUCI = 1.0;         // e fin qui si cuce, ma solo fra due capi liberi

/**
 * Le entita' del file, come oggetti {tipo, 8: strato, 10: x, ...}.
 *
 * I codici di gruppo delle LINE NON sono in coppia come uno se li
 * aspetta: prima 10 e 11 (le due x), poi 20 e 21 (le due y). Ci si
 * perde mezz'ora la prima volta.
 */
function leggi(testo) {
  const righe = testo.split(/\r?\n/).map((r) => r.trim());
  const ent = [];
  let cur = null;
  for (let i = 0; i < righe.length - 1; i += 2) {
    const cod = righe[i], val = righe[i + 1];
    if (cod === '0') {
      if (cur) ent.push(cur);
      cur = ['LINE', 'ARC', 'TEXT'].includes(val) ? { tipo: val } : null;
    } else if (cur && /^\d+$/.test(cod) && !(cod in cur)) {
      cur[cod] = val;
    }
  }
  if (cur) ent.push(cur);
  return ent;
}

/** L'entita' come catena di punti. Gli archi si spezzano. */
function punti(e) {
  const n = (k) => parseFloat(e[k]);
  if (e.tipo === 'LINE') return [[n(10), n(20)], [n(11), n(21)]];
  if (e.tipo !== 'ARC') return [[n(10), n(20)]];
  const cx = n(10), cy = n(20), r = n(40);
  let a0 = n(50), a1 = n(51);
  if (a1 <= a0) a1 += 360;
  const passi = Math.max(2, Math.ceil((a1 - a0) / PASSO_ARCO));
  const fuori = [];
  for (let k = 0; k <= passi; k++) {
    const a = (a0 + (a1 - a0) * k / passi) * Math.PI / 180;
    fuori.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return fuori;
}

function scatola(ps) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [x, y] of ps) {
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return { x0, x1, y0, y1 };
}

const area = (p) => {
  let s = 0;
  for (let i = 0; i < p.length; i++) {
    const q = p[(i + 1) % p.length];
    s += p[i][0] * q[1] - q[0] * p[i][1];
  }
  return s / 2;
};

/**
 * Spezza i segmenti dove ci finisce sopra il capo di un altro.
 *
 * Il Canaletto lo ha fatto vedere: il suo incastro e' disegnato con una
 * linea che ARRIVA A META' del fianco, non a un vertice. Per il disegno
 * e' un raccordo normale; per un grafo no -- se quel punto non e' un
 * nodo condiviso, la linea resta appesa e potando gli appesi se ne va
 * mezzo profilo.
 */
function spezzaAT(segs, chiavi) {
  const fuori = [];
  for (const [a, b] of segs) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L2 = dx * dx + dy * dy;
    if (L2 < 1e-12) continue;
    const dentro = [];
    for (const p of chiavi) {
      const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2;
      if (!(t > 1e-6 && t < 1 - 1e-6)) continue;
      const qx = a[0] + dx * t, qy = a[1] + dy * t;
      if (Math.hypot(p[0] - qx, p[1] - qy) < SNAP) dentro.push([t, p]);
    }
    if (!dentro.length) { fuori.push([a, b]); continue; }
    dentro.sort((u, v) => u[0] - v[0]);
    let prec = a;
    for (const [, p] of dentro) { fuori.push([prec, p]); prec = p; }
    fuori.push([prec, b]);
  }
  return fuori;
}

/** Il grafo dei segmenti, cucito dove il disegno non chiude. */
function grafo(segs, cuci = CUCI) {
  const nodo = new Map(), pos = new Map(), archi = new Map();
  const idDi = (p) => {
    const k = `${Math.round(p[0] / SNAP)},${Math.round(p[1] / SNAP)}`;
    if (!nodo.has(k)) nodo.set(k, nodo.size);
    const i = nodo.get(k);
    pos.set(i, p);
    return i;
  };
  for (const [a, b] of segs) {
    const ia = idDi(a), ib = idDi(b);
    if (ia === ib) continue;
    if (!archi.has(ia)) archi.set(ia, new Set());
    if (!archi.has(ib)) archi.set(ib, new Set());
    archi.get(ia).add(ib); archi.get(ib).add(ia);
  }
  /* I disegni non chiudono al centesimo: fra un'entita' e la successiva
     restano capi liberi a mezzo millimetro. Si cuciono, ma SOLO fra due
     capi liberi -- dove il disegno gia' chiude non si tocca niente, e un
     dettaglio staccato resta staccato perche' i suoi capi non hanno un
     compagno vicino. */
  for (let giro = 0; giro < 200; giro++) {
    const soli = [...archi.keys()].filter((n) => archi.get(n).size === 1);
    let coppia = null, dist = cuci;
    for (let i = 0; i < soli.length; i++) {
      for (let j = i + 1; j < soli.length; j++) {
        const a = soli[i], b = soli[j];
        if (archi.get(a).has(b)) continue;
        const d = Math.hypot(pos.get(a)[0] - pos.get(b)[0],
                             pos.get(a)[1] - pos.get(b)[1]);
        if (d < dist) { dist = d; coppia = [a, b]; }
      }
    }
    if (!coppia) break;
    archi.get(coppia[0]).add(coppia[1]);
    archi.get(coppia[1]).add(coppia[0]);
  }
  return { pos, archi };
}

/**
 * Tutte le facce chiuse del disegno.
 *
 * Da ogni lato ORIENTATO si prosegue con la virata minima a sinistra, e
 * ogni lato orientato appartiene a esattamente una faccia.
 *
 * ATTENZIONE ALLA MARCIA INDIETRO: tornare sui propri passi e' virata
 * zero, e cercando il minimo vincerebbe sempre -- il cammino
 * rimbalzerebbe sullo stesso lato e ogni faccia uscirebbe di due punti e
 * area zero. Va messa in fondo al giro, non in cima: si prende solo se
 * non c'e' nient'altro, che e' quello che serve sui rami morti.
 */
function facce(segs, cuci = CUCI) {
  const { pos, archi } = grafo(segs, cuci);
  if (!archi.size) return [];
  const ang = (a, b) => Math.atan2(pos.get(b)[1] - pos.get(a)[1],
                                   pos.get(b)[0] - pos.get(a)[0]);
  const daFare = new Set();
  for (const [a, vs] of archi) for (const b of vs) daFare.add(`${a}|${b}`);
  const fuori = [];
  while (daFare.size) {
    const via = daFare.values().next().value;
    let [a, b] = via.split('|').map(Number);
    const giro = [], lati = [];
    for (let k = 0; k < 40000; k++) {
      lati.push(`${a}|${b}`);
      giro.push(pos.get(a));
      const entrata = ang(b, a);
      let scelta = null, meglio = Infinity;
      for (const c of archi.get(b)) {
        let d = (entrata - ang(b, c)) % (2 * Math.PI);
        if (d < 0) d += 2 * Math.PI;
        if (d < 1e-9) d = 2 * Math.PI;      // la marcia indietro, in fondo
        if (d < meglio) { meglio = d; scelta = c; }
      }
      if (scelta === null) break;
      [a, b] = [b, scelta];
      if (`${a}|${b}` === via) break;
    }
    for (const l of lati) daFare.delete(l);
    if (giro.length >= 3 && Math.abs(area(giro)) > 1) fuori.push(giro);
  }
  if (!fuori.length) return [];
  // la piu' grande e' il giro di fuori: gira al contrario, e si toglie
  const grande = fuori.reduce((m, g) => Math.abs(area(g)) > Math.abs(area(m)) ? g : m);
  const verso = area(grande) > 0 ? -1 : 1;
  return fuori.filter((g) => g !== grande && area(g) * verso > 0)
    .map((g) => (area(g) > 0 ? g : [...g].reverse()))
    .sort((x, y) => Math.abs(area(y)) - Math.abs(area(x)));
}

/** Il testo «MOD. ...»: come il disegno si chiama davvero.
 *  Il NOME DEL FILE non si guarda -- in archivio sono incrociati a
 *  coppie, GENOVA.dxf contiene il 600-6V e viceversa. */
function etichetta(ent) {
  for (const e of ent) {
    const t = (e['1'] || '').trim();
    if (e.tipo === 'TEXT' && /^MOD\.?\s*\S/i.test(t)) {
      return t.replace(/^MOD\.?\s*/i, '').trim();
    }
  }
  return null;
}

/** Le quote scritte nei testi: LUCE NETTA=792, EST. TELAIO=2140... */
function quote(ent) {
  const q = {};
  for (const e of ent) {
    if (e.tipo !== 'TEXT') continue;
    const t = (e['1'] || '').replace(/\s/g, '').toUpperCase();
    const m = t.match(/^([A-Z.]+)=(\d+(?:[.,]\d+)?)$/);
    if (m) (q[m[1].replace(/\.$/, '')] ||= []).push(parseFloat(m[2].replace(',', '.')));
  }
  return q;
}

/** Le isole del foglio: le viste stanno lontane fra loro.
 *  Si guardano le SCATOLE, non i capi: un alzato non e' una linea sola
 *  -- sono riquadri staccati, la maniglia, le mitre -- e unendo per capi
 *  verrebbe fuori in dieci pezzi invece che in una vista. */
function isole(ent, aria = 6) {
  const box = ent.map((e) => scatola(punti(e)));
  const g = ent.map((_, i) => i);
  const trova = (i) => { while (g[i] !== i) { g[i] = g[g[i]]; i = g[i]; } return i; };
  for (let i = 0; i < ent.length; i++) {
    for (let j = i + 1; j < ent.length; j++) {
      const a = box[i], b = box[j];
      if (a.x0 - aria <= b.x1 && b.x0 - aria <= a.x1
          && a.y0 - aria <= b.y1 && b.y0 - aria <= a.y1) g[trova(i)] = trova(j);
    }
  }
  const fuori = new Map();
  ent.forEach((e, i) => {
    const k = trova(i);
    if (!fuori.has(k)) fuori.set(k, []);
    fuori.get(k).push(e);
  });
  return [...fuori.values()];
}

/** Tutti i segmenti di un gruppo di entita', pronti per facce(). */
function segmenti(ent) {
  const segs = [], capi = [];
  for (const e of ent) {
    const p = punti(e);
    for (let i = 0; i + 1 < p.length; i++) segs.push([p[i], p[i + 1]]);
    capi.push(p[0], p[p.length - 1]);
  }
  return spezzaAT(segs, capi);
}


/* ============================================================
   IL PROGRAMMA TROVA, L'UOMO RICONOSCE.

   E' la lezione di un giorno intero passato a sbagliare. Ogni volta che
   il programma ha provato a capire DA SOLO quale faccia fosse un vano,
   quale un telaio, quale una cornice, ha sbagliato -- e ogni sbaglio
   costava un giro. Ogni volta che qualcuno ha guardato il disegno e ha
   detto «questa qui», e' venuto giusto al primo colpo.

   Percio' qui non si indovina niente. Il DXF porta le coordinate della
   fabbrica al centesimo e il programma tira fuori tutte le facce
   chiuse; tu dici che cos'e' ognuna. Un clic per pezzo, e la precisione
   resta quella del disegno -- che e' la ragione per cui questo render
   vale piu' di un bel disegno.

   NON si ridisegna a mano: un tratto a mano e' approssimato, e
   torneremmo a un solido che non combacia con quello che si fabbrica.
   ============================================================ */

const RUOLI = [
  { id: 'anta',     et: 'Anta',      col: '#a9472f' },
  { id: 'riquadro', et: 'Riquadro',  col: '#1f6f4a' },
  { id: 'telaio',   et: 'Telaio',    col: '#2a5d9e' },
  { id: 'montante', et: 'Montante',  col: '#8a5a1f' },
  { id: 'traverso', et: 'Traverso',  col: '#7a3f8f' },
  { id: 'ignora',   et: 'Non serve', col: '#b9b2a5' },
];

const piano = document.getElementById('piano');
const px = piano.getContext('2d');
let disegno = null;      // { nome, quote, facce: [{punti, box}], ruolo: [] }
let ruoloAttivo = 'riquadro';

/* ── il disegno ─────────────────────────────────────────────────────── */
function carica(testo, nomeFile) {
  const ent = leggi(testo);
  const dis = ent.filter((e) => e.tipo !== 'TEXT');
  if (!dis.length) return;

  /* La vista piu' grande del foglio e' l'alzato. Il cartiglio e le
     lettere del logo stanno tutte dentro pochi centimetri, ma sono
     tante -- una riga di logo ha piu' entita' dell'alzato intero --
     quindi si sceglie per QUANTO FOGLIO OCCUPANO, non per quante
     entita' hanno. */
  const grandi = isole(dis, 6).filter((i) => i.length > 8);
  const est = (v) => { const s = scatola(v.flatMap(punti));
                       return (s.x1 - s.x0) * (s.y1 - s.y0); };
  grandi.sort((a, b) => est(b) - est(a));
  const alzato = grandi[0];

  const f = facce(segmenti(alzato))
    .filter((g) => { const s = scatola(g);
                     return (s.x1 - s.x0) > 30 && (s.y1 - s.y0) > 30; });

  disegno = {
    nome: etichetta(ent) || nomeFile.replace(/\.dxf$/i, ''),
    quote: quote(ent),
    ent: alzato,
    facce: f.map((g) => ({ punti: g, box: scatola(g), a: Math.abs(area(g)) })),
    ruolo: f.map(() => null),
  };
  document.getElementById('nome').textContent =
    `${disegno.nome} — ${f.length} facce chiuse`;
  document.getElementById('vuoto').hidden = true;
  document.getElementById('salva').disabled = false;
  scriviRuoli();
  aggiornaAiuto();
  ridisegna();
}

let vista = null;
function ridisegna() {
  const w = piano.clientWidth, h = piano.clientHeight, r = devicePixelRatio || 1;
  piano.width = w * r; piano.height = h * r;
  px.setTransform(r, 0, 0, r, 0, 0);
  px.clearRect(0, 0, w, h);
  if (!disegno) return;

  const s = scatola(disegno.ent.flatMap(punti));
  const k = Math.min((w - 40) / (s.x1 - s.x0), (h - 40) / (s.y1 - s.y0));
  const ox = (w - (s.x1 - s.x0) * k) / 2, oy = (h - (s.y1 - s.y0) * k) / 2;
  vista = { k, ox, oy, s };
  const T = ([x, y]) => [ox + (x - s.x0) * k, h - oy - (y - s.y0) * k];

  // il disegno, tenue: e' il fondo su cui si sceglie
  px.strokeStyle = '#c9c2b4'; px.lineWidth = 1;
  for (const e of disegno.ent) {
    const p = punti(e);
    px.beginPath();
    p.forEach((q, i) => { const [X, Y] = T(q); i ? px.lineTo(X, Y) : px.moveTo(X, Y); });
    px.stroke();
  }
  // le facce riconosciute, col colore del loro ruolo
  disegno.facce.forEach((f, i) => {
    const r0 = disegno.ruolo[i];
    if (!r0 || r0 === 'ignora') return;
    const col = RUOLI.find((x) => x.id === r0).col;
    px.strokeStyle = col; px.lineWidth = 2;
    px.fillStyle = col + '18';
    px.beginPath();
    f.punti.forEach((q, j) => { const [X, Y] = T(q); j ? px.lineTo(X, Y) : px.moveTo(X, Y); });
    px.closePath(); px.fill(); px.stroke();
  });
}

/* ── scegliere ──────────────────────────────────────────────────────── */
/* Si prende la faccia PIU' PICCOLA che contiene il punto: le facce sono
   annidate -- il bastone ne disegna due o tre per vano -- e cliccando in
   mezzo a un riquadro si finirebbe sempre sull'anta intera, che e' la
   piu' grande e le contiene tutte. */
function sotto(mx, my) {
  if (!vista) return -1;
  const h = piano.clientHeight;
  const x = vista.s.x0 + (mx - vista.ox) / vista.k;
  const y = vista.s.y0 + (h - vista.oy - my) / vista.k;
  let scelto = -1, piccola = Infinity;
  disegno.facce.forEach((f, i) => {
    if (!dentro([x, y], f.punti)) return;
    if (f.a < piccola) { piccola = f.a; scelto = i; }
  });
  return scelto;
}
function dentro(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1])
        && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

piano.addEventListener('click', (ev) => {
  if (!disegno) return;
  const r = piano.getBoundingClientRect();
  const i = sotto(ev.clientX - r.left, ev.clientY - r.top);
  if (i < 0) return;
  disegno.ruolo[i] = disegno.ruolo[i] === ruoloAttivo ? null : ruoloAttivo;
  scriviRuoli(); aggiornaAiuto(); ridisegna();
});

function scriviRuoli() {
  const c = document.getElementById('ruoli');
  c.innerHTML = RUOLI.map((r) => {
    const n = disegno ? disegno.ruolo.filter((x) => x === r.id).length : 0;
    return `<button data-ruolo="${r.id}"${r.id === ruoloAttivo ? ' class="on"' : ''}>`
         + `<span style="color:${r.id === ruoloAttivo ? '#fff' : r.col}">■</span> `
         + `${r.et}<span class="conta">${n || ''}</span></button>`;
  }).join('');
  c.querySelectorAll('[data-ruolo]').forEach((b) => b.addEventListener('click', () => {
    ruoloAttivo = b.dataset.ruolo; scriviRuoli(); aggiornaAiuto();
  }));
}

function aggiornaAiuto() {
  const a = document.getElementById('aiuto');
  if (!disegno) { a.textContent = ''; return; }
  const q = Object.entries(disegno.quote)
    .map(([k, v]) => `${k.toLowerCase()} ${v.join('×')}`).join(' · ');
  const fatti = disegno.ruolo.filter(Boolean).length;
  a.innerHTML = `Scegli il ruolo, poi clicca la faccia sul disegno. `
    + `Si prende sempre la piu' piccola che contiene il punto.<br>`
    + `<b>${fatti}</b> di ${disegno.facce.length} assegnate. ${q ? '— ' + q : ''}`;
}

/* ── trascinare un file ─────────────────────────────────────────────── */
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('sopra'); });
addEventListener('dragleave', () => document.body.classList.remove('sopra'));
addEventListener('drop', async (e) => {
  e.preventDefault(); document.body.classList.remove('sopra');
  const f = [...e.dataTransfer.files].find((x) => /\.dxf$/i.test(x.name));
  if (f) carica(await f.text(), f.name);
});

document.getElementById('salva').addEventListener('click', () => {
  const d = {
    nome: disegno.nome, quote: disegno.quote,
    pezzi: disegno.facce.map((f, i) => ({
      ruolo: disegno.ruolo[i],
      punti: f.punti.map(([x, y]) => [+x.toFixed(2), +y.toFixed(2)]),
    })).filter((p) => p.ruolo && p.ruolo !== 'ignora'),
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: 'application/json' }));
  a.download = disegno.nome.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
  a.click();
});

addEventListener('resize', ridisegna);
scriviRuoli();
</script>
</body>
</html>
