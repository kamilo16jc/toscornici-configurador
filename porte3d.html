<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porte 3D · dal disegno al solido</title>
<style>
  :root { --carta: #f2efe9; --inchiostro: #2b241d; --tenue: #9a8f80;
          --filo: #ddd6c9; --acceso: #a9472f; }
  * { box-sizing: border-box; }
  /* display:grid batte l'attributo hidden: senza questa riga il
     cartello «trascina un DXF» resta stampato sopra al disegno */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr;
         background: var(--carta); color: var(--inchiostro);
         font: 13px/1.5 Jost, "Segoe UI", system-ui, sans-serif; }

  header { display: flex; align-items: center; gap: 18px;
           padding: 10px 18px; border-bottom: 1px solid var(--filo); }
  header b { font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
             font-size: 11px; color: var(--tenue); }
  header .nome { font-size: 14px; }
  header .dx { margin-left: auto; display: flex; gap: 8px; }

  button { font: inherit; font-size: 12px; padding: 4px 11px; cursor: pointer;
           background: transparent; border: 1px solid var(--filo);
           border-radius: 3px; color: var(--inchiostro); }
  button:hover { border-color: var(--acceso); }
  button.on { background: var(--acceso); border-color: var(--acceso); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }

  main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .telo { position: relative; min-height: 0; }
  .telo + .telo { border-left: 1px solid var(--filo); }
  canvas { display: block; width: 100%; height: 100%; }
  #piano { cursor: crosshair; }

  .ruoli { position: absolute; left: 12px; top: 12px; display: flex;
           flex-direction: column; gap: 4px; }
  .ruoli button { text-align: left; min-width: 132px; }
  .ruoli .conta { color: var(--tenue); float: right; }

  .vuoto { position: absolute; inset: 0; display: grid; place-content: center;
           text-align: center; color: var(--tenue); pointer-events: none; }
  .vuoto b { display: block; font-size: 15px; color: var(--inchiostro);
             margin-bottom: 6px; font-weight: 500; }
  body.sopra .vuoto b { color: var(--acceso); }
  .aiuto { position: absolute; left: 12px; bottom: 12px; color: var(--tenue);
           font-size: 11.5px; max-width: 46ch; }
</style>
</head>
<body>

<header>
  <b>Porte 3D</b>
  <span class="nome" id="nome">— trascina qui un DXF</span>
  <span class="dx">
    <button id="salva" disabled>Salva il modello</button>
  </span>
</header>

<main>
  <div class="telo">
    <canvas id="piano"></canvas>
    <div class="ruoli" id="ruoli"></div>
    <div class="vuoto" id="vuoto"><b>Trascina un DXF</b>
      dxf/tavole-complete — o qualunque tavola di fabbrica</div>
    <div class="aiuto" id="aiuto"></div>
  </div>
  <div class="telo"><canvas id="solido"></canvas></div>
</main>

<script type="module">
import { leggi, punti, isole, segmenti, facce, etichetta, quote, scatola, area }
  from './js/dxf.js';

/* ============================================================
   IL PROGRAMMA TROVA, L'UOMO RICONOSCE.

   E' la lezione di un giorno intero passato a sbagliare. Ogni volta che
   il programma ha provato a capire DA SOLO quale faccia fosse un vano,
   quale un telaio, quale una cornice, ha sbagliato -- e ogni sbaglio
   costava un giro. Ogni volta che qualcuno ha guardato il disegno e ha
   detto «questa qui», e' venuto giusto al primo colpo.

   Percio' qui non si indovina niente. Il DXF porta le coordinate della
   fabbrica al centesimo e il programma tira fuori tutte le facce
   chiuse; tu dici che cos'e' ognuna. Un clic per pezzo, e la precisione
   resta quella del disegno -- che e' la ragione per cui questo render
   vale piu' di un bel disegno.

   NON si ridisegna a mano: un tratto a mano e' approssimato, e
   torneremmo a un solido che non combacia con quello che si fabbrica.
   ============================================================ */

const RUOLI = [
  { id: 'anta',     et: 'Anta',      col: '#a9472f' },
  { id: 'riquadro', et: 'Riquadro',  col: '#1f6f4a' },
  { id: 'telaio',   et: 'Telaio',    col: '#2a5d9e' },
  { id: 'montante', et: 'Montante',  col: '#8a5a1f' },
  { id: 'traverso', et: 'Traverso',  col: '#7a3f8f' },
  { id: 'ignora',   et: 'Non serve', col: '#b9b2a5' },
];

const piano = document.getElementById('piano');
const px = piano.getContext('2d');
let disegno = null;      // { nome, quote, facce: [{punti, box}], ruolo: [] }
let ruoloAttivo = 'riquadro';

/* ── il disegno ─────────────────────────────────────────────────────── */
function carica(testo, nomeFile) {
  const ent = leggi(testo);
  const dis = ent.filter((e) => e.tipo !== 'TEXT');
  if (!dis.length) return;

  /* La vista piu' grande del foglio e' l'alzato. Il cartiglio e le
     lettere del logo stanno tutte dentro pochi centimetri, ma sono
     tante -- una riga di logo ha piu' entita' dell'alzato intero --
     quindi si sceglie per QUANTO FOGLIO OCCUPANO, non per quante
     entita' hanno. */
  const grandi = isole(dis, 6).filter((i) => i.length > 8);
  const est = (v) => { const s = scatola(v.flatMap(punti));
                       return (s.x1 - s.x0) * (s.y1 - s.y0); };
  grandi.sort((a, b) => est(b) - est(a));
  const alzato = grandi[0];

  const f = facce(segmenti(alzato))
    .filter((g) => { const s = scatola(g);
                     return (s.x1 - s.x0) > 30 && (s.y1 - s.y0) > 30; });

  disegno = {
    nome: etichetta(ent) || nomeFile.replace(/\.dxf$/i, ''),
    quote: quote(ent),
    ent: alzato,
    facce: f.map((g) => ({ punti: g, box: scatola(g), a: Math.abs(area(g)) })),
    ruolo: f.map(() => null),
  };
  document.getElementById('nome').textContent =
    `${disegno.nome} — ${f.length} facce chiuse`;
  document.getElementById('vuoto').hidden = true;
  document.getElementById('salva').disabled = false;
  scriviRuoli();
  aggiornaAiuto();
  ridisegna();
}

let vista = null;
function ridisegna() {
  const w = piano.clientWidth, h = piano.clientHeight, r = devicePixelRatio || 1;
  piano.width = w * r; piano.height = h * r;
  px.setTransform(r, 0, 0, r, 0, 0);
  px.clearRect(0, 0, w, h);
  if (!disegno) return;

  const s = scatola(disegno.ent.flatMap(punti));
  const k = Math.min((w - 40) / (s.x1 - s.x0), (h - 40) / (s.y1 - s.y0));
  const ox = (w - (s.x1 - s.x0) * k) / 2, oy = (h - (s.y1 - s.y0) * k) / 2;
  vista = { k, ox, oy, s };
  const T = ([x, y]) => [ox + (x - s.x0) * k, h - oy - (y - s.y0) * k];

  // il disegno, tenue: e' il fondo su cui si sceglie
  px.strokeStyle = '#c9c2b4'; px.lineWidth = 1;
  for (const e of disegno.ent) {
    const p = punti(e);
    px.beginPath();
    p.forEach((q, i) => { const [X, Y] = T(q); i ? px.lineTo(X, Y) : px.moveTo(X, Y); });
    px.stroke();
  }
  // le facce riconosciute, col colore del loro ruolo
  disegno.facce.forEach((f, i) => {
    const r0 = disegno.ruolo[i];
    if (!r0 || r0 === 'ignora') return;
    const col = RUOLI.find((x) => x.id === r0).col;
    px.strokeStyle = col; px.lineWidth = 2;
    px.fillStyle = col + '18';
    px.beginPath();
    f.punti.forEach((q, j) => { const [X, Y] = T(q); j ? px.lineTo(X, Y) : px.moveTo(X, Y); });
    px.closePath(); px.fill(); px.stroke();
  });
}

/* ── scegliere ──────────────────────────────────────────────────────── */
/* Si prende la faccia PIU' PICCOLA che contiene il punto: le facce sono
   annidate -- il bastone ne disegna due o tre per vano -- e cliccando in
   mezzo a un riquadro si finirebbe sempre sull'anta intera, che e' la
   piu' grande e le contiene tutte. */
function sotto(mx, my) {
  if (!vista) return -1;
  const h = piano.clientHeight;
  const x = vista.s.x0 + (mx - vista.ox) / vista.k;
  const y = vista.s.y0 + (h - vista.oy - my) / vista.k;
  let scelto = -1, piccola = Infinity;
  disegno.facce.forEach((f, i) => {
    if (!dentro([x, y], f.punti)) return;
    if (f.a < piccola) { piccola = f.a; scelto = i; }
  });
  return scelto;
}
function dentro(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1])
        && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

piano.addEventListener('click', (ev) => {
  if (!disegno) return;
  const r = piano.getBoundingClientRect();
  const i = sotto(ev.clientX - r.left, ev.clientY - r.top);
  if (i < 0) return;
  disegno.ruolo[i] = disegno.ruolo[i] === ruoloAttivo ? null : ruoloAttivo;
  scriviRuoli(); aggiornaAiuto(); ridisegna();
});

function scriviRuoli() {
  const c = document.getElementById('ruoli');
  c.innerHTML = RUOLI.map((r) => {
    const n = disegno ? disegno.ruolo.filter((x) => x === r.id).length : 0;
    return `<button data-ruolo="${r.id}"${r.id === ruoloAttivo ? ' class="on"' : ''}>`
         + `<span style="color:${r.id === ruoloAttivo ? '#fff' : r.col}">■</span> `
         + `${r.et}<span class="conta">${n || ''}</span></button>`;
  }).join('');
  c.querySelectorAll('[data-ruolo]').forEach((b) => b.addEventListener('click', () => {
    ruoloAttivo = b.dataset.ruolo; scriviRuoli(); aggiornaAiuto();
  }));
}

function aggiornaAiuto() {
  const a = document.getElementById('aiuto');
  if (!disegno) { a.textContent = ''; return; }
  const q = Object.entries(disegno.quote)
    .map(([k, v]) => `${k.toLowerCase()} ${v.join('×')}`).join(' · ');
  const fatti = disegno.ruolo.filter(Boolean).length;
  a.innerHTML = `Scegli il ruolo, poi clicca la faccia sul disegno. `
    + `Si prende sempre la piu' piccola che contiene il punto.<br>`
    + `<b>${fatti}</b> di ${disegno.facce.length} assegnate. ${q ? '— ' + q : ''}`;
}

/* ── trascinare un file ─────────────────────────────────────────────── */
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('sopra'); });
addEventListener('dragleave', () => document.body.classList.remove('sopra'));
addEventListener('drop', async (e) => {
  e.preventDefault(); document.body.classList.remove('sopra');
  const f = [...e.dataTransfer.files].find((x) => /\.dxf$/i.test(x.name));
  if (f) carica(await f.text(), f.name);
});

document.getElementById('salva').addEventListener('click', () => {
  const d = {
    nome: disegno.nome, quote: disegno.quote,
    pezzi: disegno.facce.map((f, i) => ({
      ruolo: disegno.ruolo[i],
      punti: f.punti.map(([x, y]) => [+x.toFixed(2), +y.toFixed(2)]),
    })).filter((p) => p.ruolo && p.ruolo !== 'ignora'),
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: 'application/json' }));
  a.download = disegno.nome.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
  a.click();
});

addEventListener('resize', ridisegna);
scriviRuoli();
</script>
</body>
</html>
