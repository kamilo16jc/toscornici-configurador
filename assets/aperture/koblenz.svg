<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-label="">
<style>.m{stroke:#2b211a;stroke-width:7;stroke-linecap:butt}.a{stroke:#a8843c;stroke-width:5;stroke-linecap:round}.t{stroke:#8d7d6a;stroke-width:1.1;stroke-dasharray:3 4;opacity:.5}.s{stroke:#8d7d6a;stroke-width:1.6;opacity:.75}line,path,rect{fill:none}g,path,line,rect{transform-box:view-box}.p1{transform-origin:70px 50px;animation:f1 4.6s ease-in-out infinite}.p2{transform-origin:99px 50px;animation:f2 4.6s ease-in-out infinite}@keyframes f1{0%,10%{transform:rotate(0)}50%,66%{transform:rotate(-74deg)}94%,100%{transform:rotate(0)}}@keyframes f2{0%,10%{transform:rotate(0)}50%,66%{transform:rotate(150deg)}94%,100%{transform:rotate(0)}}</style>
<line class="m" x1="8" y1="50" x2="70" y2="50"/><line class="m" x1="130" y1="50" x2="192" y2="50"/><g class="p1"><line class="a" x1="70" y1="50" x2="99" y2="50"/><g class="p2"><line class="a" x1="99" y1="50" x2="128" y2="50"/></g></g>
